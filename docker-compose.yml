version: "3.9"

services:
  controller:
    build: ./controller
    ports:
      - "8000:8000"
    volumes:
      - ./controller:/app
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload

  uav1:
    build: ./uav
    environment:
      - CONTROLLER_URL=http://controller:8000
    volumes:
      - ./uav:/app
      - ./configs/uav1.json:/config/uav_config.json

  uav2:
    build: ./uav
    environment:
      - CONTROLLER_URL=http://controller:8000
    volumes:
      - ./uav:/app
      - ./configs/uav2.json:/config/uav_config.json