<!DOCTYPE html>
<html>
<head>
    <title>UAV Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: #eee;
        }

        h1 {
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 250px);
            gap: 15px;
            padding: 20px;
        }

        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .low {
            color: red;
        }

        .ok {
            color: lime;
        }
        .card img {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>UAV Live Dashboard</h1>
<button id="pauseBtn" onclick="togglePause()" style="display:block; margin: 0 auto 20px auto; padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background: red; color: white;">Pause All</button>
<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById("grid");

const ws = new WebSocket("ws://localhost:8000/ws");

async function togglePause() {
    await fetch("/toggle_pause", { method: "POST" });
}

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    const btn = document.getElementById("pauseBtn");
    if (btn) {
        btn.innerText = data.is_paused ? "Resume All" : "Pause All";
        btn.style.background = data.is_paused ? "green" : "red";
    }
    render(data.uavs);
};

const cards = {};

function render(uavs) {
    Object.values(uavs).forEach(uav => {
        const battery = uav.battery_pct.toFixed(1);

        let card = cards[uav.name];

        if (!card) {
            card = document.createElement("div");
            card.className = "card";
            grid.appendChild(card);
            cards[uav.name] = card;
        }
        console.log(uav.current_image)
        card.innerHTML = `
            <h3>${uav.name}</h3>
            <p>Model: ${uav.model}</p>
            <p>Flight State: ${uav.flight_state}</p>
            <p>Battery: 
                <span class="${battery < 20 ? 'low' : 'ok'}">
                    ${battery}%
                </span>
            </p>
            <p>Energy: ${uav.battery_j.toFixed(0)} J</p>
            <p>Edge: ${uav.edge_device || "None"}</p>

            Inference Result: <span style="
                color: ${
                    uav.inference_result === true
                    ? 'red'
                    : uav.inference_result === false
                    ? 'green'
                    : 'inherit'
                }
                ">
                 ${
                    uav.inference_result === true
                    ? "FIRE"
                    : uav.inference_result === false
                    ? "SAFE"
                    : "None"
                }
            </span>

            ${
                uav.current_image
                ? `<img src="${uav.current_image}" style="border: 3px solid ${uav.inference_result ? 'red' : 'green'};" />`
                : `<p style="opacity:0.5;">No image</p>`
            }
        `;
    });
}
</script>

</body>
</html>
